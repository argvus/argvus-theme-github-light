# ARGVUS theme manifest. The palette is rendered into every component by
# the templates in /usr/share/argvus/theme/consumers.d.
schema = 2
id = "github-light"
name = "GitHub Light"
category = "light"
wallpaper = "/usr/share/backgrounds/argvus/abstract/light/github-light-abstract-light.jxl"

[name_i18n]
